spring.application.name=News_ai

# ===== DataSource MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/news_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.context-path=/

spring.output.ansi.enabled=ALWAYS

# Authentication and browser access
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Optional development bootstrap administrator
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Hugging Face API pour UC3 - Résumer un article (IA)
huggingface.api.key=${HUGGINGFACE_API_KEY}

# NewsAPI Configuration
newsapi.api.key=${NEWS_API_KEY}
newsapi.api.base-url=https://newsapi.org/v2
