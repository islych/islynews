spring.application.name=News_ai

# ===== DataSource MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/news_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.open-in-view=false
server.servlet.context-path=/

spring.output.ansi.enabled=ALWAYS

# Authentication and browser access
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Optional development bootstrap administrator
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Email verification (disabled until SMTP credentials are configured)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@islynews.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Hugging Face API pour UC3 - Résumer un article (IA)
huggingface.api.key=${HUGGINGFACE_API_KEY}

# NewsAPI Configuration
newsapi.api.key=${NEWS_API_KEY}
newsapi.api.base-url=https://newsapi.org/v2

# GNews Configuration
gnews.api.key=${GNEWS_API_KEY}
gnews.api.base-url=https://gnews.io/api/v4

# Local portfolio demo only. Keep disabled in every deployed environment.
app.dev.article-extraction-enabled=${ARTICLE_EXTRACTION_ENABLED:false}

# Redis cache protects external API quotas and improves response time
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.redis.time-to-live=${NEWS_CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
